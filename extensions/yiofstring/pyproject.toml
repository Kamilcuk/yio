[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yiofstring"
version = "0.1.0"
description = "C f-string preprocessor"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff",
    "basedpyright",
    "pytest",
]

[project.scripts]
yiofstring = "yiofstring:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
